<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Graze — Charcuterie & Grazing Tables</title>
    <meta name="description" content="Island Graze brings the taste of the islands to your table with artisan charcuterie boards, grazing carts, and grazing tables. Serving Jamaica and Tampa, Florida." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Static, hidden mirror of the Contact page form so Netlify's build-time
      bot can detect it — Netlify Forms only scans the built static HTML, not
      the React app's client-rendered DOM.
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="location" />
      <input type="tel" name="phone" />
      <input type="date" name="date" />
      <input type="text" name="event" />
      <input type="text" name="guests" />
      <input type="text" name="discountCode" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
